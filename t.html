.bad{background:#fde3e1!important;border-color:#d2352b!important}

.small{color:#5b5b66;font-size:21px}

.v:hover{background:#e4e0fb}

.cw.on{background:#6d5fd3;color:#fff}
.cw.ok{background:#3f9d5c!important;border-color:#3f9d5c!important;color:#fff!important}

.pre.b{font-weight:700;margin-top:10px}

.gap.fx{cursor:default}
.gap.fx:hover{background:transparent;color:transparent}
.sent.pm{line-height:1.7}
